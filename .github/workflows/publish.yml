name: Publish Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create (e.g. v1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Prepare Version
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install Dependencies and Build
        run: |
          npm install
          npm run build

      - name: Bump Version
        run: npm version --no-git-tag-version "$VERSION"

      - name: Generate Changelog
        run: npx -y conventional-changelog -i CHANGELOG.md -s -r 0

      - name: Format Changelog
        run: npx -y prettier --write CHANGELOG.md

      - name: Commit Version and Changelog
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md package.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: release $TAG"
          git tag "$TAG"
          git push origin HEAD:master --tags

      - name: Publish to NPM
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body: "Release ${{ inputs.tag }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
